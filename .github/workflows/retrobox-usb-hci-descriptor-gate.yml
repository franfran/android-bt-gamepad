name: RetroBox DS3 Userspace USB HCI Descriptor Gate (Host Only)

# DEFERRED by Owner (2026-11-02): USB dongle testing belongs in a future PR.
# Retain host-only test provenance; never run automatically on plugin-only PR #52.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic descriptor preflight (no Android/USB/HCI/network)
        run: |
          python3 -m unittest discover \
            -s experiments/m3-ds3-compat-adapter \
            -p test_usb_hci_descriptor_gate.py -v
