name: RetroBox DS3 Legacy Auth Trace (Host Only)

on:
  pull_request:
    paths:
      - "experiments/m3-ds3-cable-session/analyze_legacy_auth_trace.py"
      - "experiments/m3-ds3-cable-session/test_analyze_legacy_auth_trace.py"
      - "experiments/m3-ds3-cable-session/verify_h618_legacy_auth_trace_patch.py"
      - "experiments/m3-ds3-cable-session/h618_legacy_auth_decision_trace_disabled.patch"
      - ".github/workflows/retrobox-legacy-auth-trace.yml"
  push:
    branches: ["research/m3-ds3-compat-adapter"]
    paths:
      - "experiments/m3-ds3-cable-session/analyze_legacy_auth_trace.py"
      - "experiments/m3-ds3-cable-session/test_analyze_legacy_auth_trace.py"
      - "experiments/m3-ds3-cable-session/verify_h618_legacy_auth_trace_patch.py"
      - "experiments/m3-ds3-cable-session/h618_legacy_auth_decision_trace_disabled.patch"
      - ".github/workflows/retrobox-legacy-auth-trace.yml"

permissions:
  contents: read

jobs:
  synthetic-legacy-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dormant observer and synthetic-only cases
        run: python3 experiments/m3-ds3-cable-session/verify_h618_legacy_auth_trace_patch.py
